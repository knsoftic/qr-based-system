plugins {
    id 'com.android.application'
}

// Release signing: keystore.properties + the .jks file stay on the build machine (never in git).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'site.pkpay.smsforwarder'
    compileSdk 36

    defaultConfig {
        applicationId 'site.pkpay.smsforwarder'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"https://pkpay.site"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Plain http allowed only for local testing.
            manifestPlaceholders = [usesCleartext: 'true']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartext: 'false']
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
